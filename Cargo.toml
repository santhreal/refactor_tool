[package]
name = "refactor_tool"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Pattern-based AST refactor helper for surgec modules"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "refactor_tool"
path = "src/main.rs"

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[[test]]
name = "adversarial_tests"
path = "tests/adversarial/mod.rs"

[workspace]

[dev-dependencies]
tempfile = "3"
