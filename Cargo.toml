[package]
name = "refactor_tool"
version = "0.1.4"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
description = "Pattern-based AST refactor helper for surgec modules"
keywords = ["refactoring", "ast", "codegen"]
homepage = "https://santh.dev"
repository = "https://github.com/santhreal/refactor_tool"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "README.md"

[package.metadata.santh]
status = "alpha"

[lib]
path = "src/lib.rs"

[[bin]]
name = "refactor_tool"
path = "src/main.rs"

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[[test]]
name = "adversarial_tests"
path = "tests/adversarial/mod.rs"

[workspace]

[dev-dependencies]
tempfile = "3"

[[test]]
name = "property_tests"
path = "tests/property/mod.rs"
